name: Build Capsule v2 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Setup Environment & Suppress SDK Warning
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
        echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties

    - name: Install Modern Gradle 8.4
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
        unzip -q gradle.zip
        echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

    - name: Build APK
      run: gradle assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: capsule-v2-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
