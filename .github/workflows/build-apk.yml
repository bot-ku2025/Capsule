name: Build Capsule APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'
        accept-android-sdk-licenses: true

    - name: Configure Android SDK Path
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Install Gradle Manually
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH

    - name: Generate Wrapper and Build APK
      run: |
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: capsule-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
